# Development/testing container for Querydown. See docs/docker-dev.md.
#
# Usage:
#   docker compose build
#   docker compose run --rm dev
services:
  dev:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    # Keep stdin/tty open for an interactive shell + Claude Code.
    stdin_open: true
    tty: true
    # Cap container memory so a runaway build (e.g. parallel test-binary linking) is OOM-killed
    # *inside the container* rather than exhausting host RAM and freezing the host desktop via swap
    # thrashing. memswap_limit == mem_limit disables container swap, so it fails fast instead of
    # thrashing. Tune to leave a few GB of headroom for your host; combine with `.cargo/config.toml`
    # (jobs cap), which lowers the peak this needs to absorb. Takes effect on container recreate.
    mem_limit: 12g
    memswap_limit: 12g
    working_dir: /workspace
    volumes:
      # The project source, edited live from the host.
      - .:/workspace
      # Isolate build artifacts from the host's ./target (different cache,
      # avoids churn) and persist them across container runs.
      - target:/workspace/target
      # Persist downloaded crates so rebuilds don't re-fetch every time.
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      # Share your authenticated Claude Code login + config with the container.
      # Comment out if you'd rather log in separately inside the container.
      - ${HOME}/.claude:/home/dev/.claude
      - ${HOME}/.claude.json:/home/dev/.claude.json

volumes:
  target:
  cargo-registry:
  cargo-git:

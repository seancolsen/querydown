[package]
name = "querydown-cli"
description = "A command line interface for the Querydown language, which compiles to SQL"
keywords = ["querydown", "sql", "query-language", "cli"]
categories = ["command-line-utilities", "database"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
querydown.workspace = true
clap = { version = "4.4.11", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# We override the name of the binary for src/main.rs, which otherwise would be
# querydown-cli (matching the crate name).
[[bin]]
name = "querydown"
path = "src/main.rs"

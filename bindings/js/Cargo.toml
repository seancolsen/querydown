[package]
name = "querydown-js"
description = "Javascript bindings for the Querydown compiler"
authors = ["Sean Colsen <colsen.sean@gmail.com>"]
publish = false

edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
querydown = { path = "../../compiler" }
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
# Must stay paired with `wasm-bindgen` above: the runner discovers registered tests via a protocol
# that changes between releases, so a mismatched pair silently reports "no tests to run".
wasm-bindgen-test = "0.3.76"
js-sys = "0.3"


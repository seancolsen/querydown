# This crate isn't published to crates.io. `wasm-pack` builds it into the `querydown-js` npm package,
# whose package.json it generates from the fields below.
[package]
name = "querydown-js"
description = "The Querydown compiler, built to WebAssembly: compile Querydown to SQL in a browser or in Node.js"
keywords = ["querydown", "sql", "query-language", "wasm", "compiler"]
publish = false

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
querydown.workspace = true
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
js-sys = "0.3"

[dev-dependencies]
# Must stay paired with `wasm-bindgen` above: the runner discovers registered tests via a protocol
# that changes between releases, so a mismatched pair silently reports "no tests to run".
wasm-bindgen-test = "0.3.76"


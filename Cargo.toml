[workspace]
resolver = "2"
members = [
    "cli",
    "parser",
    "compiler",
    "bindings/js",
]

# Every package in the repository (the crates here, and the npm packages built from `bindings/`)
# shares this one version. Change it with `scripts/release.sh prepare <version>`, which also updates
# the pins below and the CodeMirror package. See RELEASING.md.
[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Sean Colsen <colsen.sean@gmail.com>"]
repository = "https://github.com/seancolsen/querydown"
homepage = "https://querydown.org"
rust-version = "1.67.0"

# The crates depend on each other at exactly the same version, since they're released together and
# the parser's API is internal to Querydown.
[workspace.dependencies]
querydown = { version = "=0.0.1", path = "compiler" }
querydown-parser = { version = "=0.0.1", path = "parser" }

[profile.dev]
# Full debug info (`debug = 2`) makes the combined `.debug_info` sections exceed 4 GB, which
# overflows the 32-bit `R_X86_64_32` relocations the linker uses for them and breaks linking.
# Line tables keep backtraces useful while staying well under that limit.
debug = "line-tables-only"

[profile.release]
lto = true
opt-level = 'z'
